<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NangkringAceh</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #090b0a; color: white; font-family: Arial, Helvetica, sans-serif; }
body { min-height: 100vh; }
.app { width: 100%; max-width: 1500px; margin: auto; }

/* HEADER */
header { padding: 18px 16px 12px; background: #0c0f0d; border-bottom: 1px solid #202420; position: sticky; top: 0; z-index: 1000; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand h1 { margin: 0; color: #22d68a; font-size: 25px; }
.brand p { margin: 5px 0 0; color: #8d938e; font-size: 12px; }
.gps-status { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 10px; background: #151916; border: 1px solid #292d29; color: #999; font-size: 10px; white-space: nowrap; }
.gps-dot { width: 8px; height: 8px; border-radius: 50%; background: #777; }
.gps-dot.active { background: #22d68a; box-shadow: 0 0 8px #22d68a; }

/* SEARCH */
.search-area { display: flex; gap: 8px; margin-top: 14px; }
.search-box { flex: 1; position: relative; }
.search-box input { width: 100%; height: 44px; padding: 0 44px 0 14px; border-radius: 12px; border: 1px solid #282d29; background: #151815; color: white; outline: none; font-size: 14px; }
.search-box input:focus { border-color: #22d68a; }
.search-icon { position: absolute; right: 14px; top: 12px; color: #777; font-size: 18px; }
.btn { height: 44px; min-width: 44px; border: 0; border-radius: 12px; background: #242824; color: white; cursor: pointer; font-size: 18px; }
.btn-green { background: #22d68a; color: #00140d; }

/* MODE */
.mode-area, .filter-area, .radius-area { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
.mode-area::-webkit-scrollbar, .filter-area::-webkit-scrollbar, .radius-area::-webkit-scrollbar { display: none; }
.mode-btn, .filter-btn, .radius-btn { white-space: nowrap; border: 1px solid #292e2a; background: #151815; color: #999; padding: 9px 13px; border-radius: 30px; cursor: pointer; font-size: 11px; }
.mode-btn.active, .filter-btn.active, .radius-btn.active { background: #22d68a; color: #00140d; border-color: #22d68a; font-weight: bold; }
.radius-area.disabled { opacity: .35; pointer-events: none; }

/* STATUS */
.status { padding: 10px 16px; background: #0d100e; color: #888; font-size: 11px; }
.status.success { color: #22d68a; }
.status.error { color: #ff657c; }

/* MAP */
#map { width: 100%; height: 46vh; min-height: 330px; }

/* RESULTS */
.results-header { display: flex; justify-content: space-between; align-items: center; padding: 17px 16px 7px; }
.results-header h2 { margin: 0; font-size: 18px; }
.count { color: #22d68a; font-size: 12px; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 12px; padding: 10px 16px 30px; }
.place-card { background: #151815; border: 1px solid #252a26; border-radius: 17px; padding: 13px; transition: .2s; }
.place-card:hover { border-color: #22d68a; }
.place-top { display: flex; align-items: center; gap: 10px; }
.place-icon { width: 42px; height: 42px; border-radius: 12px; background: #202520; display: flex; justify-content: center; align-items: center; font-size: 22px; flex-shrink: 0; }
.place-info { flex: 1; min-width: 0; }
.place-name { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-type { margin-top: 4px; color: #22d68a; font-size: 10px; }
.favorite { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #242824; color: #aaa; font-size: 18px; cursor: pointer; }
.favorite.active { background: #ff3f61; color: white; }
.place-address { margin-top: 12px; color: #929792; font-size: 10px; line-height: 1.5; }
.place-distance { margin-top: 8px; color: #22d68a; font-size: 11px; font-weight: bold; }
.place-actions { display: flex; gap: 6px; margin-top: 12px; }
.place-actions button { flex: 1; border: 0; border-radius: 9px; padding: 8px 5px; background: #242824; color: white; cursor: pointer; font-size: 10px; }
.place-actions .direction { background: #22d68a; color: #00140d; }
.loading, .empty { grid-column: 1 / -1; text-align: center; padding: 45px 20px; color: #777; }
.spinner { width: 30px; height: 30px; border: 3px solid #252a26; border-top-color: #22d68a; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 15px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MAP MARKER */
.place-marker { width: 34px; height: 34px; border-radius: 50%; background: #22d68a; border: 3px solid #052116; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.45); }
.place-marker.fav { background: #ff3f61; border-color: #4c0715; }
.user-marker { width: 18px; height: 18px; border-radius: 50%; background: #168cff; border: 4px solid white; box-shadow: 0 0 0 7px rgba(22,140,255,.2); }

/* POPUP */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #151815; color: white; }
.leaflet-popup-content { margin: 14px; }
.popup-title { font-weight: bold; font-size: 14px; margin-bottom: 7px; }
.popup-type { color: #22d68a; font-size: 10px; margin-bottom: 7px; }
.popup-address { color: #999; font-size: 10px; line-height: 1.5; }
.popup-distance { color: #22d68a; font-size: 10px; margin-top: 6px; }
.popup-direction { display: inline-block; margin-top: 10px; padding: 8px 11px; background: #22d68a; color: #00140d; border-radius: 8px; text-decoration: none; font-size: 10px; font-weight: bold; }

/* FOOTER */
footer { padding: 25px 16px 40px; text-align: center; color: #555; font-size: 10px; }

@media (max-width: 600px) {
    header { padding: 13px 10px 10px; }
    .brand h1 { font-size: 21px; }
    .brand p { font-size: 10px; }
    .gps-status { font-size: 8px; padding: 6px 7px; }
    .places { grid-template-columns: 1fr; padding: 10px; }
    .results-header { padding-left: 10px; padding-right: 10px; }
    #map { height: 390px; }
}
</style>
</head>

<body>

<div class="app">
    <header>
        <div class="brand">
            <div>
                <h1>🍵 NangkringAceh</h1>
                <p>Temukan tempat nongkrong keren di seluruh Aceh</p>
            </div>
            <div class="gps-status">
                <span id="gpsDot" class="gps-dot"></span>
                <span id="gpsText">Mencari lokasi...</span>
            </div>
        </div>

        <div class="search-area">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Cari kopi, cafe, restoran..." autocomplete="off">
                <span class="search-icon">⌕</span>
            </div>
            <button class="btn btn-green" onclick="refreshSearch()">🔄</button>
            <button class="btn" onclick="locateUser()">📍</button>
        </div>

        <div class="mode-area">
            <button id="modeNearby" class="mode-btn active" onclick="setMode('nearby')">📍 Sekitar Saya</button>
            <button id="modeAceh" class="mode-btn" onclick="setMode('aceh')">🗺️ Seluruh Aceh</button>
            <button id="modeFavorite" class="mode-btn" onclick="setMode('favorite')">❤️ Favorit</button>
        </div>

        <div class="filter-area">
            <button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
            <button class="filter-btn" onclick="setFilter('cafe', this)">☕ Cafe</button>
            <button class="filter-btn" onclick="setFilter('coffee', this)">🍵 Kopi</button>
            <button class="filter-btn" onclick="setFilter('restaurant', this)">🍛 Restoran</button>
            <button class="filter-btn" onclick="setFilter('fast_food', this)">🍔 Fast Food</button>
        </div>

        <div id="radiusArea" class="radius-area">
            <span style="display:flex; align-items:center; color:#777; font-size:10px;">Radius:</span>
            <button class="radius-btn active" onclick="setRadius(1, this)">1 km</button>
            <button class="radius-btn" onclick="setRadius(3, this)">3 km</button>
            <button class="radius-btn" onclick="setRadius(5, this)">5 km</button>
            <button class="radius-btn" onclick="setRadius(10, this)">10 km</button>
        </div>
    </header>

    <div id="status" class="status">📍 Sedang mencari lokasi kamu...</div>

    <div id="map"></div>

    <div class="results-header">
        <h2>📌 Tempat Nongkrong</h2>
        <span id="resultCount" class="count">0 tempat</span>
    </div>

    <div id="places" class="places">
        <div class="loading">
            <div class="spinner"></div>
            Mencari tempat...
        </div>
    </div>

    <footer>
        Data tempat bersumber dari OpenStreetMap.
        <br>
        © OpenStreetMap contributors
    </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* =========================================================
   NANGKRINGACEH FRONTEND
   Menggunakan API Overpass Publik (untuk testing CodePen)
========================================================= */

/* STATE */
let map = null;
let markerCluster = null;
let userMarker = null;
let accuracyCircle = null;
let userLocation = null;
let allPlaces = [];
let currentMode = "nearby";
let currentFilter = "all";
let currentRadius = 1;
let isLoading = false;

/* FAVORITES */
let favorites = [];
try {
    favorites = JSON.parse(localStorage.getItem("nangkringaceh_favorites") || "[]");
    if (!Array.isArray(favorites)) { favorites = []; }
} catch (error) { favorites = []; }

/* INIT */
function init() {
    initMap();
    bindSearch();
    requestLocation();
}

/* MAP */
function initMap() {
    map = L.map("map", { zoomControl: true }).setView([4.6951, 96.7494], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    markerCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 45,
        spiderfyOnMaxZoom: true,
        removeOutsideVisibleBounds: true
    });

    map.addLayer(markerCluster);
}

/* =========================================================
   GPS
========================================================= */
function requestLocation() {
    if (!navigator.geolocation) {
        userLocation = null;
        setGPSStatus(false, "GPS tidak tersedia");
        showDefaultAceh();
        if (currentMode === "aceh") { loadAllAceh(); }
        return;
    }

    setStatus("📍 Meminta izin lokasi...");

    navigator.geolocation.getCurrentPosition(
        function(position) {
            userLocation = {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                accuracy: position.coords.accuracy || 50
            };
            setGPSStatus(true, "Lokasi ditemukan");
            showUserLocation();

            if (currentMode === "nearby") {
                map.setView([userLocation.lat, userLocation.lon], 15);
                loadNearby();
            } else if (currentMode === "aceh") {
                loadAllAceh();
            } else {
                renderPlaces();
            }
        },
        function(error) {
            console.warn("GPS error:", error);
            userLocation = null;
            setGPSStatus(false, "Lokasi belum tersedia");
            showDefaultAceh();

            if (currentMode === "aceh") {
                loadAllAceh();
            } else {
                setStatus("⚠️ GPS tidak tersedia. Mode Seluruh Aceh tetap bisa digunakan.", "error");
            }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
}

function showUserLocation() {
    if (!userLocation) return;
    if (userMarker) map.removeLayer(userMarker);
    if (accuracyCircle) map.removeLayer(accuracyCircle);

    userMarker = L.marker([userLocation.lat, userLocation.lon], {
        icon: L.divIcon({
            className: "",
            html: '<div class="user-marker"></div>',
            iconSize: [18,18],
            iconAnchor: [9,9]
        })
    }).addTo(map).bindPopup("<b>📍 Lokasi Kamu</b>");

    accuracyCircle = L.circle([userLocation.lat, userLocation.lon], {
        radius: Math.min(userLocation.accuracy || 50, 1000),
        color: "#22d68a",
        fillColor: "#22d68a",
        fillOpacity: 0.08,
        weight: 1
    }).addTo(map);
}

function locateUser() { requestLocation(); }

function showDefaultAceh() {
    map.setView([4.6951, 96.7494], 7);
}

function setGPSStatus(active, text) {
    document.getElementById("gpsDot").classList.toggle("active", active);
    document.getElementById("gpsText").textContent = text;
}

/* =========================================================
   FUNGSI setStatus YANG HILANG (SUDAH DITAMBAHKAN)
========================================================= */
function setStatus(message, type = "") {
    const statusEl = document.getElementById("status");
    if (statusEl) {
        statusEl.textContent = message;
        statusEl.classList.remove("success", "error");
        if (type) {
            statusEl.classList.add(type);
        }
    }
}

/* =========================================================
   OVERPASS API (LANGSUNG KE PUBLIK UNTUK TESTING)
========================================================= */
async function queryOverpass(query) {
    // Menggunakan API publik Overpass
    const url = "https://overpass-api.de/api/interpreter";
    
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "data=" + encodeURIComponent(query)
    });

    const text = await response.text();

    if (!response.ok) {
        let message = "Server gagal mengambil data.";
        try {
            const data = JSON.parse(text);
            if (data.error) message = data.error;
        } catch (_) {}
        throw new Error(message);
    }

    let data;
    try {
        data = JSON.parse(text);
    } catch (error) {
        throw new Error("Data Overpass tidak valid.");
    }

    if (!data || !Array.isArray(data.elements)) {
        throw new Error("Format data Overpass tidak valid.");
    }

    return data.elements;
}

/* =========================================================
   NEARBY
========================================================= */
async function loadNearby() {
    if (!userLocation) {
        setStatus("📍 Lokasi belum ditemukan.", "error");
        return;
    }
    if (isLoading) return;

    isLoading = true;
    showLoading();
    setStatus(`🔎 Mencari tempat dalam radius ${currentRadius} km...`);

    try {
        const radius = Math.round(currentRadius * 1000);
        const query = `
[out:json][timeout:25];
(
    nwr(around:${radius}, ${userLocation.lat}, ${userLocation.lon})["amenity"~"^(cafe|restaurant|fast_food|coffee_shop)$"];
    nwr(around:${radius}, ${userLocation.lat}, ${userLocation.lon})["shop"="coffee"];
);
out center tags;
        `;

        const elements = await queryOverpass(query);
        allPlaces = normalizePlaces(elements);

        allPlaces = allPlaces.filter(function(place) {
            return (place.distance !== null && place.distance <= currentRadius);
        });

        allPlaces.sort(function(a,b) { return a.distance - b.distance; });

        renderMarkers();
        renderPlaces();
        setStatus(`✅ Ditemukan ${allPlaces.length} tempat dalam radius ${currentRadius} km.`, "success");

    } catch (error) {
        console.error("Nearby error:", error);
        allPlaces = [];
        renderMarkers();
        renderPlaces();
        setStatus("❌ Gagal mengambil data sekitar. Coba 🔄 lagi.", "error");
    } finally {
        isLoading = false;
    }
}

/* =========================================================
   SELURUH ACEH
========================================================= */
async function loadAllAceh() {
    if (isLoading) return;
    isLoading = true;
    showLoading();
    setStatus("🗺️ Mengambil data tempat di seluruh Aceh...");

    try {
        const queries = [
            `[out:json][timeout:25]; area["boundary"="administrative"]["ISO3166-2"="ID-AC"]->.aceh; node(area.aceh)["amenity"~"^(cafe|restaurant|fast_food|coffee_shop)$"]; node(area.aceh)["shop"="coffee"]; out tags;`,
            `[out:json][timeout:25]; area["boundary"="administrative"]["ISO3166-2"="ID-AC"]->.aceh; way(area.aceh)["amenity"~"^(cafe|restaurant|fast_food|coffee_shop)$"]; way(area.aceh)["shop"="coffee"]; out center tags;`,
            `[out:json][timeout:25]; area["boundary"="administrative"]["ISO3166-2"="ID-AC"]->.aceh; relation(area.aceh)["amenity"~"^(cafe|restaurant|fast_food|coffee_shop)$"]; relation(area.aceh)["shop"="coffee"]; out center tags;`
        ];

        let elements = [];
        let berhasil = 0;

        for (let i = 0; i < queries.length; i++) {
            setStatus(`🗺️ Mengambil data Aceh... bagian ${i + 1}/3`);
            try {
                const result = await queryOverpass(queries[i]);
                if (Array.isArray(result)) {
                    elements = elements.concat(result);
                    berhasil++;
                }
            } catch (error) {
                console.warn("Bagian Aceh gagal:", i + 1, error);
            }
        }

        if (berhasil === 0) throw new Error("Semua query Aceh gagal.");

        console.log("Data mentah Aceh:", elements.length);
        allPlaces = normalizePlaces(elements);

        if (userLocation) {
            allPlaces.forEach(function(place) {
                place.distance = calculateDistance(userLocation.lat, userLocation.lon, place.lat, place.lon);
            });
            allPlaces.sort(function(a,b) {
                return ((a.distance ?? 999999) - (b.distance ?? 999999));
            });
        } else {
            allPlaces.sort(function(a,b) { return a.name.localeCompare(b.name); });
        }

        renderMarkers();
        renderPlaces();
        setStatus(`🗺️ Berhasil menemukan ${allPlaces.length} tempat di seluruh Aceh.`, "success");

        if (allPlaces.length > 0 && !userLocation) {
            fitPlacesBounds();
        } else if (allPlaces.length > 0) {
            map.setView([4.6951,96.7494], 7);
        }

    } catch (error) {
        console.error("Aceh error:", error);
        allPlaces = [];
        renderMarkers();
        renderPlaces();
        setStatus("❌ Data seluruh Aceh gagal diambil. Coba 🔄 lagi.", "error");
    } finally {
        isLoading = false;
    }
}

/* =========================================================
   NORMALIZE
========================================================= */
function normalizePlaces(elements) {
    const result = [];
    const seen = new Set();

    elements.forEach(function(el) {
        const tags = el.tags || {};
        const lat = Number(el.lat ?? el.center?.lat);
        const lon = Number(el.lon ?? el.center?.lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

        const category = getCategory(tags);
        if (category === "other") return;

        const name = cleanName(tags.name || tags["name:id"] || tags["name:en"] || "Tempat tanpa nama");
        const duplicateKey = name.toLowerCase() + "|" + lat.toFixed(5) + "|" + lon.toFixed(5);

        if (seen.has(duplicateKey)) return;
        seen.add(duplicateKey);

        let distance = null;
        if (userLocation) {
            distance = calculateDistance(userLocation.lat, userLocation.lon, lat, lon);
        }

        result.push({
            id: el.type + "_" + el.id,
            osmId: el.id,
            osmType: el.type,
            name: name,
            category: category,
            address: buildAddress(tags),
            lat: lat,
            lon: lon,
            distance: distance,
            tags: tags
        });
    });

    return result;
}

/* =========================================================
   CATEGORY
========================================================= */
function getCategory(tags) {
    const amenity = tags.amenity || "";
    const shop = tags.shop || "";
    const name = (tags.name || tags["name:id"] || tags["name:en"] || "").toLowerCase();

    if (amenity === "coffee_shop" || shop === "coffee" || /kopi|coffee|warkop|kedai kopi/.test(name)) {
        return "coffee";
    }
    if (amenity === "cafe") return "cafe";
    if (amenity === "restaurant") return "restaurant";
    if (amenity === "fast_food") return "fast_food";
    return "other";
}

function categoryLabel(category) {
    const labels = { cafe: "☕ Cafe", coffee: "🍵 Kedai Kopi", restaurant: "🍛 Restoran", fast_food: "🍔 Fast Food", other: "📍 Tempat" };
    return (labels[category] || labels.other);
}

function categoryIcon(category) {
    const icons = { cafe: "☕", coffee: "🍵", restaurant: "🍛", fast_food: "🍔", other: "📍" };
    return (icons[category] || "📍");
}

/* =========================================================
   ADDRESS
========================================================= */
function buildAddress(tags) {
    const fields = ["addr:housenumber", "addr:street", "addr:place", "addr:suburb", "addr:neighbourhood", "addr:village", "addr:town", "addr:city", "addr:county", "addr:state"];
    const parts = [];
    fields.forEach(function(field) {
        if (tags[field] && !parts.includes(tags[field])) {
            parts.push(tags[field]);
        }
    });
    if (parts.length) return parts.join(", ");
    return "Alamat belum tersedia";
}

/* =========================================================
   CLEAN NAME
========================================================= */
function cleanName(name) {
    return String(name).replace(/\s+/g, " ").trim();
}

/* =========================================================
   DISTANCE
========================================================= */
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = toRadians(lat2 - lat1);
    const dLon = toRadians(lon2 - lon1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function toRadians(value) {
    return (value * Math.PI / 180);
}

function formatDistance(distance) {
    if (distance === null || !Number.isFinite(distance)) return "Jarak tidak tersedia";
    if (distance < 1) return (Math.round(distance * 1000) + " m");
    return (distance.toFixed(1) + " km");
}

/* =========================================================
   MARKERS
========================================================= */
function renderMarkers() {
    if (!markerCluster) return;
    markerCluster.clearLayers();

    allPlaces.forEach(function(place) {
        const favorite = isFavorite(place.id);
        const marker = L.marker([place.lat, place.lon], {
            icon: L.divIcon({
                className: "",
                html: `<div class="place-marker ${favorite ? "fav" : ""}">${categoryIcon(place.category)}</div>`,
                iconSize: [34,34],
                iconAnchor: [17,17]
            })
        });

        const distance = place.distance !== null && Number.isFinite(place.distance)
            ? `<div class="popup-distance">📏 ${formatDistance(place.distance)}</div>`
            : "";

        marker.bindPopup(`
            <div class="popup-title">${categoryIcon(place.category)} ${escapeHTML(place.name)}</div>
            <div class="popup-type">${categoryLabel(place.category)}</div>
            <div class="popup-address">📍 ${escapeHTML(place.address)}</div>
            ${distance}
            <a class="popup-direction" href="${getGoogleMapsUrl(place)}" target="_blank" rel="noopener">🧭 Arah</a>
        `);

        markerCluster.addLayer(marker);
    });
}

/* =========================================================
   RENDER PLACES
========================================================= */
function renderPlaces() {
    const container = document.getElementById("places");
    const count = document.getElementById("resultCount");
    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    let places = [...allPlaces];

    if (currentMode === "favorite") {
        places = places.filter(function(place) { return isFavorite(place.id); });
    }

    if (currentFilter !== "all") {
        places = places.filter(function(place) { return (place.category === currentFilter); });
    }

    if (query) {
        places = places.filter(function(place) {
            const text = (place.name + " " + place.address).toLowerCase();
            return text.includes(query);
        });
    }

    count.textContent = places.length + " tempat";
    const displayPlaces = places.slice(0, 300);

    if (displayPlaces.length === 0) {
        container.innerHTML = `<div class="empty">😕<br><br>Tidak ada tempat ditemukan.<br><br>Coba ubah pencarian atau filter.</div>`;
        return;
    }

    container.innerHTML = displayPlaces.map(createPlaceCard).join("");
}

/* =========================================================
   CARD
========================================================= */
function createPlaceCard(place) {
    const favorite = isFavorite(place.id);
    const distance = place.distance !== null && Number.isFinite(place.distance) ? formatDistance(place.distance) : "Jarak tidak tersedia";

    return `
        <div class="place-card" onclick="focusPlace('${escapeAttribute(place.id)}')">
            <div class="place-top">
                <div class="place-icon">${categoryIcon(place.category)}</div>
                <div class="place-info">
                    <div class="place-name">${escapeHTML(place.name)}</div>
                    <div class="place-type">${categoryLabel(place.category)}</div>
                </div>
                <button class="favorite ${favorite ? "active" : ""}" onclick="event.stopPropagation(); toggleFavorite('${escapeAttribute(place.id)}')">
                    ${favorite ? "♥" : "♡"}
                </button>
            </div>
            <div class="place-address">📍 ${escapeHTML(place.address)}</div>
            <div class="place-distance">📏 ${distance}</div>
            <div class="place-actions">
                <button onclick="event.stopPropagation(); focusPlace('${escapeAttribute(place.id)}')">🗺️ Peta</button>
                <button class="direction" onclick="event.stopPropagation(); openDirections('${escapeAttribute(place.id)}')">🧭 Arah</button>
                <button onclick="event.stopPropagation(); sharePlace('${escapeAttribute(place.id)}')">↗ Bagikan</button>
            </div>
        </div>
    `;
}

/* =========================================================
   FOCUS
========================================================= */
function focusPlace(id) {
    const place = allPlaces.find(function(item) { return (item.id === id); });
    if (!place) return;

    map.setView([place.lat, place.lon], 17, { animate: true });

    markerCluster.eachLayer(function(marker) {
        const position = marker.getLatLng();
        if (Math.abs(position.lat - place.lat) < 0.00001 && Math.abs(position.lng - place.lon) < 0.00001) {
            marker.openPopup();
        }
    });
}

/* =========================================================
   DIRECTIONS
========================================================= */
function getGoogleMapsUrl(place) {
    return ("https://www.google.com/maps/dir/?api=1" + "&destination=" + encodeURIComponent(place.lat + "," + place.lon));
}

function openDirections(id) {
    const place = allPlaces.find(function(item) { return (item.id === id); });
    if (!place) return;
    window.open(getGoogleMapsUrl(place), "_blank");
}

/* =========================================================
   FAVORITE
========================================================= */
function isFavorite(id) { return favorites.includes(id); }

function toggleFavorite(id) {
    if (isFavorite(id)) {
        favorites = favorites.filter(function(item) { return item !== id; });
    } else {
        favorites.push(id);
    }
    localStorage.setItem("nangkringaceh_favorites", JSON.stringify(favorites));
    renderPlaces();
    renderMarkers();
}

/* =========================================================
   SHARE
========================================================= */
async function sharePlace(id) {
    const place = allPlaces.find(function(item) { return (item.id === id); });
    if (!place) return;

    const url = getGoogleMapsUrl(place);
    const text = `📍 ${place.name}\n${categoryLabel(place.category)}\n📍 ${place.address}\n\n${url}`;

    try {
        if (navigator.share) {
            await navigator.share({ title: place.name, text: text });
        } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            alert("Info tempat berhasil disalin.");
        }
    } catch (error) {
        console.log("Share dibatalkan.");
    }
}

/* =========================================================
   MODE
========================================================= */
function setMode(mode) {
    currentMode = mode;

    document.getElementById("modeNearby").classList.toggle("active", mode === "nearby");
    document.getElementById("modeAceh").classList.toggle("active", mode === "aceh");
    document.getElementById("modeFavorite").classList.toggle("active", mode === "favorite");

    const radiusArea = document.getElementById("radiusArea");

    if (mode === "nearby") {
        radiusArea.classList.remove("disabled");
        if (userLocation) { loadNearby(); } else { requestLocation(); }
    } else if (mode === "aceh") {
        radiusArea.classList.add("disabled");
        loadAllAceh();
    } else {
        radiusArea.classList.add("disabled");
        renderPlaces();
    }
}

/* =========================================================
   RADIUS
========================================================= */
function setRadius(radius, button) {
    currentRadius = Number(radius);
    document.querySelectorAll(".radius-btn").forEach(function(btn) { btn.classList.remove("active"); });
    button.classList.add("active");

    if (currentMode === "nearby") {
        if (userLocation) { loadNearby(); } else { requestLocation(); }
    }
}

/* =========================================================
   FILTER
========================================================= */
function setFilter(filter, button) {
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(function(btn) { btn.classList.remove("active"); });
    button.classList.add("active");
    renderPlaces();
    renderMarkers();
}

/* =========================================================
   SEARCH
========================================================= */
function bindSearch() {
    const input = document.getElementById("searchInput");
    input.addEventListener("input", function() { renderPlaces(); });
}

/* =========================================================
   REFRESH
========================================================= */
function refreshSearch() {
    if (currentMode === "nearby") {
        if (userLocation) { loadNearby(); } else { requestLocation(); }
    } else if (currentMode === "aceh") {
        loadAllAceh();
    } else {
        renderPlaces();
    }
}

/* =========================================================
   FIT MAP
========================================================= */
function fitPlacesBounds() {
    if (allPlaces.length === 0) return;

    const bounds = L.latLngBounds(allPlaces.map(function(place) {
        return [place.lat, place.lon];
    }));

    if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [30,30], maxZoom: 10 });
    }
}

/* =========================================================
   LOADING
========================================================= */
function showLoading() {
    document.getElementById("places").innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Sedang mengambil data tempat...
        </div>
    `;
    document.getElementById("resultCount").textContent = "Mencari...";
}

/* =========================================================
   ESCAPE
========================================================= */
function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

/* START */
document.addEventListener("DOMContentLoaded", function() {
    init();
});
</script>
